# To trigger publishing, tag the commit and push up the tag using the commands
# shown below. The version number must match the package version in the
# pyproject.toml file and be prefixed with v.
#
# git tag -a v26.11 -m "Release v26.11"
# git push origin v26.11

name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false

      - name: Verify tag matches package version
        run: |
          if [[ "$GITHUB_REF_NAME" != "v$(uv version --short)" ]]; then
            echo "::error::The version tag must match the version in pyproject.toml."
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Upload distributions artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/htmlkit/
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false

      - name: Download distributions artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish distributions
        run: uv publish --trusted-publishing always

[project]
name = "htmpy"
version = "0.1"
description = "Write HTML in Python"
readme = "README.md"
authors = [{name = "Gavin Wiggins"}]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.143.1",
    "jinja2>=3.1.6",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.87",
]

[tool.ruff]
line-length = 100

[tool.uv]
python-preference = "only-managed"

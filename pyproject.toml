[project]
name = "htmlkit"
version = "26.11"
description = "Write HTML in Python"
readme = "README.md"
authors = [{name = "Gavin Wiggins"}]
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.14"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "markupsafe>=3.0.4",
]

[project.urls]
Repository = "https://github.com/wigging/htmlkit"
Issues = "https://github.com/wigging/htmlkit/issues"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.143.1",
    "jinja2>=3.1.6",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.87",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
python-preference = "only-managed"
